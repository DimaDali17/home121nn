<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Квартира 69,5 м² в 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
/* Layout: full-bleed 3D canvas; a floating plan-sheet panel on the left (bottom sheet on phones). */
:root{
  --bg:#e9ebe7; --panel:#fbfbf8; --ink:#1f2622; --muted:#66706a; --line:#d5d9d2;
  --accent:#4f6b5c; --accent-ink:#ffffff; --chip:#eef1ec;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171b19; --panel:#202623; --ink:#e7ebe6; --muted:#9aa49e; --line:#343c37;
  --accent:#8fb3a0; --accent-ink:#13201a; --chip:#2a312d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171b19; --panel:#202623; --ink:#e7ebe6; --muted:#9aa49e; --line:#343c37;
  --accent:#8fb3a0; --accent-ink:#13201a; --chip:#2a312d; color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body)}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.panel{position:fixed;z-index:5;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  width:272px;max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 16px 14px;display:flex;flex-direction:column;gap:16px;
  box-shadow:0 8px 30px rgba(0,0,0,.08)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.15;margin:4px 0 0;text-wrap:balance}
h1 small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted);display:block;margin-top:6px;letter-spacing:0}
.group{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--chip);border-radius:7px;padding:7px 10px;font-size:13px;line-height:1.2}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rooms{display:flex;flex-direction:column;gap:4px}
.rooms button{display:flex;justify-content:space-between;align-items:baseline;text-align:left;background:transparent;border-color:transparent;padding:6px 8px}
.rooms button:hover{background:var(--chip)}
.rooms button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rooms .a{font-variant-numeric:tabular-nums;color:inherit;opacity:.7;font-size:12px}
.hint{font-size:12px;color:var(--muted);line-height:1.45;border-top:1px solid var(--line);padding-top:10px}
.hint b{color:var(--ink);font-weight:600}
.labels{position:fixed;inset:0;pointer-events:none;z-index:2}
.lbl{position:absolute;transform:translate(-50%,-50%);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:11.5px;white-space:nowrap;line-height:1.25;text-align:center}
.lbl i{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.toggle{display:none}
.walk{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,44px);gap:6px}
.walk button{height:44px;padding:0;font-size:16px;background:var(--panel)}
.walk .sp{visibility:hidden}
.walk[hidden],.lbl[hidden]{display:none!important}
@media (max-width:640px){
  .panel{top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));width:auto;max-height:48%;gap:12px;padding:14px}
  .panel.closed .body{display:none}
  .toggle{display:inline-block;align-self:flex-start}
  h1{font-size:17px}
  .walk{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="labels" id="labels"></div>

<aside class="panel" id="panel">
  <div>
    <div class="eyebrow">3D-макет · М 1:60 → 1:1</div>
    <h1>Квартира 69,5&nbsp;м²<small>3 комнаты, кухня-гостиная, 2 санузла · потолок 2,9 м</small></h1>
  </div>
  <button class="toggle" id="toggle" aria-expanded="true">Скрыть меню</button>
  <div class="body" style="display:flex;flex-direction:column;gap:16px">
    <div class="group">
      <div class="eyebrow">Вид</div>
      <div class="row">
        <button id="v-over" aria-pressed="true">Обзор</button>
        <button id="v-top" aria-pressed="false">План сверху</button>
      </div>
      <div class="row">
        <button id="t-cut" aria-pressed="false">Срез стен</button>
        <button id="t-lbl" aria-pressed="true">Подписи</button>
      </div>
    </div>
    <div class="group">
      <div class="eyebrow">Встать внутри</div>
      <div class="rooms" id="rooms"></div>
    </div>
    <div class="hint" id="hint"></div>
  </div>
</aside>

<div class="walk" id="walk" hidden>
  <span class="sp"></span><button id="w-f" aria-label="Вперёд">↑</button><span class="sp"></span>
  <button id="w-l" aria-label="Влево">←</button><button id="w-b" aria-label="Назад">↓</button><button id="w-r" aria-label="Вправо">→</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const S=0.001, H=2900, CX=5450, CY=3700;
const X=x=>(x-CX)*S, Z=y=>(y-CY)*S;

/* ---------- renderer ---------- */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
function bgColor(){return getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#e9ebe7';}
function applyBg(){scene.background=new THREE.Color(bgColor());}
applyBg();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyBg);}catch(e){}
new MutationObserver(applyBg).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

const camera=new THREE.PerspectiveCamera(50,1,0.02,200);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.09;

scene.add(new THREE.HemisphereLight(0xffffff,0xb8b0a4,0.62));
const sun=new THREE.DirectionalLight(0xfff4e6,0.75);
sun.position.set(-6,12,-8);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9,near:1,far:40});
sun.shadow.bias=-0.0004;
scene.add(sun);
const fill=new THREE.DirectionalLight(0xffffff,0.25);fill.position.set(8,6,10);scene.add(fill);

/* ---------- textures ---------- */
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};}
function herringbone(){ // маньчжурский орех, ёлочка (планка 600×150)
  const u=48,L=4,T=2*L*u,c=document.createElement('canvas');c.width=c.height=T;const g=c.getContext('2d');
  g.fillStyle='#3d2a1f';g.fillRect(0,0,T,T);
  const tones=['#6f4d38','#7a5641','#664632','#83604a','#5d4130','#73513c','#8a674f'];
  const rnd=rng(11);
  const plank=(x,y,w,h)=>{const col=tones[Math.floor(rnd()*tones.length)];g.fillStyle=col;g.fillRect(x+1,y+1,w-2,h-2);
    g.globalAlpha=.10;g.strokeStyle='#2c1d14';for(let i=0;i<3;i++){g.beginPath();const horiz=w>h;
      if(horiz){const yy=y+3+rnd()*(h-6);g.moveTo(x+2,yy);g.bezierCurveTo(x+w*.3,yy+rnd()*4-2,x+w*.7,yy+rnd()*4-2,x+w-2,yy);}
      else{const xx=x+3+rnd()*(w-6);g.moveTo(xx,y+2);g.bezierCurveTo(xx+rnd()*4-2,y+h*.3,xx+rnd()*4-2,y+h*.7,xx,y+h-2);}
      g.stroke();}g.globalAlpha=1;};
  for(let s=-2;s<=2;s++)for(let k=-2*L;k<=4*L;k++){const ox=s*2*L;plank((k+ox)*u,k*u,L*u,u);plank((k+ox)*u,(k+1)*u,u,L*u);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;
}
function terrazzo(base,grout,speck,seed){ // керамогранит 1200×600
  const c=document.createElement('canvas');c.width=512;c.height=256;const g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,512,256);const rnd=rng(seed||3);
  for(let i=0;i<1100;i++){g.fillStyle=speck[Math.floor(rnd()*speck.length)];const r=rnd()*2.4+.4;g.beginPath();g.arc(rnd()*512,rnd()*256,r,0,7);g.fill();}
  g.strokeStyle=grout;g.lineWidth=3;g.strokeRect(0,0,512,256);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;return t;
}
function subway(base,grout,shine){ // кабанчик вертикальной укладкой
  const c=document.createElement('canvas');c.width=256;c.height=256;const g=c.getContext('2d');
  g.fillStyle=grout;g.fillRect(0,0,256,256);const rnd=rng(5);
  for(let col=0;col<8;col++){const v=Math.floor(rnd()*14)-7;g.fillStyle=base;g.fillRect(col*32+1,0,30,256);g.fillStyle=`rgba(${v>0?255:0},${v>0?255:0},${v>0?255:0},${Math.abs(v)/120})`;g.fillRect(col*32+1,0,30,256);g.fillStyle=shine;g.fillRect(col*32+5,0,5,256);}
  for(let col=0;col<8;col++){const off=(col%2)*64;g.fillStyle=grout;for(let y=off;y<256;y+=128)g.fillRect(col*32,y,32,2);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;return t;
}
function rattan(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.fillStyle='#2b2724';g.fillRect(0,0,64,64);g.strokeStyle='#4a423b';g.lineWidth=2;
  for(let i=-64;i<128;i+=8){g.beginPath();g.moveTo(i,0);g.lineTo(i+64,64);g.stroke();g.beginPath();g.moveTo(i+64,0);g.lineTo(i,64);g.stroke();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(6,2);t.encoding=THREE.sRGBEncoding;return t;}

/* ---------- materials (палитра 3D-эскизов) ---------- */
const mats={};
function M(color,o={}){const k=color+JSON.stringify(o);if(!mats[k])mats[k]=new THREE.MeshStandardMaterial(Object.assign({color,roughness:.8,metalness:0},o));return mats[k];}
const C={
  wall:'#ebe8e2', sage:'#7b8c7d', sageDark:'#667868', walnut:'#7a5a44', walnutDark:'#5e4434', door:'#8b6c56', doorFrame:'#5b4334',
  teal:'#4e6966', top:'#ece9e3', white:'#f5f5f2', sofa:'#cbccc7', sofaShadow:'#babbb5', black:'#232322', steel:'#c9cccd', linen:'#f3f1ec'
};
const wallMat=M(C.wall,{roughness:.95});
const glassMat=new THREE.MeshStandardMaterial({color:0xcfe3ea,transparent:true,opacity:.25,roughness:.05,metalness:.1,depthWrite:false});
const showerGlass=new THREE.MeshStandardMaterial({color:0xdfeef0,transparent:true,opacity:.22,roughness:.05,depthWrite:false});
const walnut=M(C.walnut,{roughness:.6}),walnutD=M(C.walnutDark,{roughness:.6}),sage=M(C.sage,{roughness:.55}),top=M(C.top,{roughness:.35}),
      dark=M(C.black,{roughness:.45}),steel=M(C.steel,{roughness:.3,metalness:.6}),white=M(C.white,{roughness:.25}),
      sofaM=M(C.sofa,{roughness:1}),sofaS=M(C.sofaShadow,{roughness:1}),blackMetal=M('#1e1e1e',{roughness:.35,metalness:.5}),
      doorM=M(C.door,{roughness:.55}),frameM=M(C.doorFrame,{roughness:.55}),teal=M(C.teal,{roughness:.55});

/* ---------- helpers (план в мм: x → вправо, y → вниз, z — высота) ---------- */
const walls=new THREE.Group(), deco=new THREE.Group();
scene.add(walls,deco);
function bx(x1,y1,x2,y2,z0,z1,mat,parent=scene,shadow=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x2-x1)*S,(z1-z0)*S,Math.abs(y2-y1)*S),mat);
  m.position.set(X((x1+x2)/2),(z0+z1)/2*S,Z((y1+y2)/2));
  if(shadow){m.castShadow=true;m.receiveShadow=true;}
  parent.add(m);return m;
}
function cyl(cx,cy,r,z0,z1,mat,parent=scene,seg=32,r2){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r*S,(r2==null?r:r2)*S,(z1-z0)*S,seg),mat);
  m.position.set(X(cx),(z0+z1)/2*S,Z(cy));m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
function lbox(w,h,d,x,y,z,mat,parent){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
function grp(cx,cy,rot,parent=scene){const g=new THREE.Group();g.position.set(X(cx),0,Z(cy));g.rotation.y=rot||0;parent.add(g);return g;}
function wall(axis,t1,t2,a1,a2,ops=[],mat=wallMat){
  const piece=(a,b,z0,z1,m=mat)=>axis==='x'?bx(a,t1,b,t2,z0,z1,m,walls):bx(t1,a,t2,b,z0,z1,m,walls);
  let c=a1;ops.slice().sort((p,q)=>p[0]-q[0]).forEach(o=>{
    if(o[0]>c)piece(c,o[0],0,H);
    if(o[2]>0)piece(o[0],o[1],0,o[2]);
    if(o[3]<H)piece(o[0],o[1],o[3],H);
    if(o[4]){const mid=(t1+t2)/2;const g=axis==='x'?bx(o[0],mid-8,o[1],mid+8,o[2],o[3],glassMat,walls,false):bx(mid-8,o[0],mid+8,o[1],o[2],o[3],glassMat,walls,false);g.renderOrder=2;
      const fr=M('#f0f0ed');[o[2],o[3]-50].forEach(z=>axis==='x'?bx(o[0],mid-30,o[1],mid+30,z,z+50,fr,walls):bx(mid-30,o[0],mid+30,o[1],z,z+50,fr,walls));
      const n=Math.max(1,Math.round((o[1]-o[0])/750));for(let i=0;i<=n;i++){const p=o[0]+(o[1]-o[0])*i/n;const a=Math.max(o[0],p-25),b=Math.min(o[1],p+25);axis==='x'?bx(a,mid-30,b,mid+30,o[2],o[3],fr,walls):bx(mid-30,a,mid+30,b,o[2],o[3],fr,walls);}
      const tz=o[3]-650;axis==='x'?bx(o[0],mid-28,o[1],mid+28,tz,tz+40,fr,walls):bx(mid-28,o[0],mid+28,o[1],tz,tz+40,fr,walls);}
    if(o[5]){ // наличники двери
      const f=[[o[0]-70,o[0]+5],[o[1]-5,o[1]+70]];
      f.forEach(([a,b])=>axis==='x'?bx(a,t1-12,b,t2+12,0,o[3]-5,frameM,walls):bx(t1-12,a,t2+12,b,0,o[3]-5,frameM,walls));
      axis==='x'?bx(o[0]-70,t1-12,o[1]+70,t2+12,o[3]-5,o[3]+70,frameM,walls):bx(t1-12,o[0]-70,t2+12,o[1]+70,o[3]-5,o[3]+70,frameM,walls);}
    c=o[1];
  });
  if(c<a2)piece(c,a2,0,H);
}
/* облицовка: плоскость на стене. wx — стена вдоль Y (x=coord), wy — стена вдоль X (y=coord); n — сторона нормали */
function clad(kind,coord,a1,a2,z0,z1,n,tex,tw,th,rough=.35){
  const len=a2-a1,t=tex.clone();t.needsUpdate=true;t.repeat.set(len/tw,(z1-z0)/th);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(len*S,(z1-z0)*S),new THREE.MeshStandardMaterial({map:t,roughness:rough}));
  if(kind==='wx'){m.rotation.y=n>0?Math.PI/2:-Math.PI/2;m.position.set(X(coord+n*3),(z0+z1)/2*S,Z((a1+a2)/2));}
  else{m.rotation.y=n>0?0:Math.PI;m.position.set(X((a1+a2)/2),(z0+z1)/2*S,Z(coord+n*3));}
  m.receiveShadow=true;walls.add(m);return m;
}

/* ---------- floors ---------- */
const floors=[];
const vinyl=herringbone();
function floor(x1,y1,x2,y2,tex,tileW,tileH,z=0){
  const t=tex.clone();t.needsUpdate=true;t.repeat.set((x2-x1)/tileW,(y2-y1)/tileH);
  const m=new THREE.Mesh(new THREE.PlaneGeometry((x2-x1)*S,(y2-y1)*S),new THREE.MeshStandardMaterial({map:t,roughness:.55}));
  m.rotation.x=-Math.PI/2;m.position.set(X((x1+x2)/2),z*S,Z((y1+y2)/2));m.receiveShadow=true;scene.add(m);floors.push(m);return m;
}
floor(0,0,10900,5670,vinyl,1200,1200);
floor(0,5670,6087,7400,vinyl,1200,1200);
const porcelain=terrazzo('#dfdbd4','#cdc7bd',['#b8b1a6','#a69f94','#f1eee8','#c8c1b6','#8f887e'],3);
floor(8771,3100,10900,5670,porcelain,1200,600,3);
floor(4403,5422,6087,7400,porcelain,1200,600,3);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x9aa098,roughness:1,transparent:true,opacity:.18}));
ground.rotation.x=-Math.PI/2;ground.position.y=-0.02;scene.add(ground);

/* ---------- walls (лист 01, пересчёт 8,86 мм на пиксель плана) ---------- */
// наружные
wall('x',-300,0,-300,11200,[[2392,3898,850,2600,1],[5449,7593,80,2760,1]]);
wall('y',-300,0,0,7400,[[1108,3588,850,2600,1],[5183,7195,850,2600,1]]);
// подоконники ПВХ и радиаторы под окнами спальни и детской
{const sill=M('#f4f4f1',{roughness:.4}),rad=M('#f0f0ee',{roughness:.5});
 bx(2392,0,3898,180,830,850,sill);bx(2700,0,3600,90,200,700,rad);
 bx(0,1108,180,3588,830,850,sill);bx(0,1700,90,3000,200,700,rad);
 bx(0,5183,180,7195,830,850,sill);bx(0,5600,90,6800,200,700,rad);}
wall('y',10900,11200,-300,5900);
wall('x',7400,7700,-300,6335);
wall('y',6087,6335,5670,7400);
wall('x',5670,5900,6087,11200,[[7531,8524,0,2100,0,1]]);
bx(4500,0,4625,1152,0,H,M('#d9d6cf'),walls);                                // пилон
// перегородки
wall('x',4093,4182,0,4385);                                                    // спальня | детская
wall('y',4385,4500,0,4182,[[3172,4000,0,2100,0,1]]);                           // спальня | гостиная, коридор
wall('y',4385,4483,4182,5183,[[4209,5112,0,2100,0,1]]);                       // детская | коридор
wall('y',4314,4403,5183,7400);                                                 // детская | санузел 2
wall('y',3074,3190,1081,3100);                                                 // гардероб
wall('x',1081,1170,3190,4385);
wall('x',2968,3100,3872,4385);
wall('x',3960,4050,5378,7380);                                                 // гостиная | ниша прихожей (буфет)
wall('y',5378,5467,4050,4342);                                                 // полки 610
wall('y',6087,6175,4050,5670);                                                 // коридор | прихожая
wall('y',7265,7380,4050,4961);
bx(4403,5183,4935,5422,0,H,M('#d9d6cf'),walls);                               // короб стояков

rooms.forEach(r=>{const d=document.createElement('div');d.className='lbl';d.innerHTML=r.name+'<br><i>'+r.area+' м²</i>';labelsEl.appendChild(d);r.el=d;r.v=new THREE.Vector3(X(r.c[0]),.05,Z(r.c[1]));});
let showLabels=true;
const tmp=new THREE.Vector3();
function placeLabels(){
  const w=renderer.domElement.clientWidth,h=renderer.domElement.clientHeight;
  rooms.forEach(r=>{
    if(!showLabels||mode==='inside'){r.el.hidden=true;return;}
    tmp.copy(r.v).project(camera);
    if(tmp.z>1){r.el.hidden=true;return;}
    r.el.hidden=false;r.el.style.left=((tmp.x+1)/2*w)+'px';r.el.style.top=((1-tmp.y)/2*h)+'px';
  });
}

/* ---------- camera modes ---------- */
let mode='orbit',anim=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function setOrbitControls(){controls.enableZoom=true;controls.enablePan=true;controls.rotateSpeed=.8;controls.minDistance=2;controls.maxDistance=30;controls.minPolarAngle=0;controls.maxPolarAngle=Math.PI/2.05;}
function setInsideControls(){controls.enableZoom=false;controls.enablePan=false;controls.rotateSpeed=-.35;controls.minDistance=.01;controls.maxDistance=.2;controls.minPolarAngle=.35;controls.maxPolarAngle=Math.PI-.35;}
function flyTo(pos,target,after){
  const p0=camera.position.clone(),t0=controls.target.clone(),start=performance.now(),dur=reduce?1:850;
  controls.minDistance=0;controls.maxDistance=100;
  anim=now=>{let k=Math.min(1,(now-start)/dur);const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(p0,pos,e);controls.target.lerpVectors(t0,target,e);
    if(k>=1){anim=null;after&&after();}};
}
const wide=()=>innerWidth>900?-1.3:0;
function overview(){mode='orbit';setWalk(false);setOrbitControls();setFov(48);if(!cut)toggleCut();flyTo(new THREE.Vector3(2.6+wide(),11,9.2),new THREE.Vector3(wide(),0,.6),setOrbitControls);press('v-over');}
function topView(){mode='orbit';setWalk(false);setOrbitControls();setFov(48);flyTo(new THREE.Vector3(wide(),15.5,.01),new THREE.Vector3(wide(),0,0),setOrbitControls);press('v-top');}
function goInside(pos,dir){
  mode='inside';setWalk(true);if(cut)toggleCut();setFov(72);
  const target=pos.clone().add(dir.clone().normalize().multiplyScalar(.05));
  flyTo(pos,target,setInsideControls);
}
function roomView(r){
  const pos=new THREE.Vector3(X(r.cam[0]),r.cam[2]*S,Z(r.cam[1])),look=new THREE.Vector3(X(r.look[0]),r.look[2]*S,Z(r.look[1]));
  goInside(pos,look.sub(pos));press('room-'+r.id);
}
function setFov(f){camera.fov=f;camera.updateProjectionMatrix();}

/* ---------- UI ---------- */
const roomsEl=document.getElementById('rooms');
rooms.forEach(r=>{const b=document.createElement('button');b.id='room-'+r.id;b.setAttribute('aria-pressed','false');b.innerHTML='<span>'+r.name+'</span><span class="a">'+r.area+' м²</span>';b.onclick=()=>roomView(r);roomsEl.appendChild(b);});
function press(id){document.querySelectorAll('#v-over,#v-top,.rooms button').forEach(b=>b.setAttribute('aria-pressed',b.id===id?'true':'false'));}
document.getElementById('v-over').onclick=overview;
document.getElementById('v-top').onclick=topView;
let cut=false;
const clipPlane=new THREE.Plane(new THREE.Vector3(0,-1,0),1.22);renderer.localClippingEnabled=true;
Object.values(mats).forEach(m=>{m.side=THREE.DoubleSide;});
function toggleCut(){cut=!cut;walls.scale.y=cut?.42:1;deco.visible=!cut;scene.traverse(o=>{if(o.isMesh&&!floors.includes(o)){o.material.clippingPlanes=cut?[clipPlane]:[];o.material.clipShadows=true;o.material.needsUpdate=true;}});document.getElementById('t-cut').setAttribute('aria-pressed',cut);}
document.getElementById('t-cut').onclick=()=>{if(mode==='inside')overview();toggleCut();};
document.getElementById('t-lbl').onclick=e=>{showLabels=!showLabels;e.currentTarget.setAttribute('aria-pressed',showLabels);};
const panel=document.getElementById('panel'),tg=document.getElementById('toggle');
tg.onclick=()=>{const c=panel.classList.toggle('closed');tg.textContent=c?'Меню':'Скрыть меню';tg.setAttribute('aria-expanded',!c);};
const touch=matchMedia('(pointer: coarse)').matches;
document.getElementById('hint').innerHTML=touch
 ?'<b>Палец</b> — вращать · <b>щипок</b> — масштаб · <b>двойной тап</b> по полу — встать в эту точку. Внутри: стрелки внизу — идти.'
 :'<b>Тяни</b> — вращать · <b>колесо</b> — масштаб · <b>правая кнопка</b> — сдвиг · <b>двойной клик</b> по полу — встать в эту точку. Внутри: <b>WASD</b> или стрелки — идти.';
const walkEl=document.getElementById('walk');
function setWalk(on){walkEl.hidden=!on||!touch;}

/* ---------- walking ---------- */
const keys={};
addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&e.key===' ')return;keys[e.key.toLowerCase()]=true;});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const held={};
[['w-f','f'],['w-b','b'],['w-l','l'],['w-r','r']].forEach(([id,k])=>{const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{held[k]=true;e.preventDefault();});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>held[k]=false));});
const fwd=new THREE.Vector3(),side=new THREE.Vector3(),up=new THREE.Vector3(0,1,0);
function walk(dt){
  if(mode!=='inside'||anim)return;
  let f=0,s=0;
  if(keys['w']||keys['arrowup']||keys['ц']||held.f)f+=1;
  if(keys['s']||keys['arrowdown']||keys['ы']||held.b)f-=1;
  if(keys['a']||keys['arrowleft']||keys['ф']||held.l)s-=1;
  if(keys['d']||keys['arrowright']||keys['в']||held.r)s+=1;
  if(!f&&!s)return;
  fwd.subVectors(controls.target,camera.position);fwd.y=0;fwd.normalize();side.crossVectors(fwd,up);
  const step=fwd.multiplyScalar(f*1.6*dt).add(side.multiplyScalar(s*1.6*dt));
  camera.position.add(step);controls.target.add(step);
}

/* ---------- double click / double tap on floor ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function pickFloor(cx,cy){
  const r=renderer.domElement.getBoundingClientRect();
  ndc.set((cx-r.left)/r.width*2-1,-(cy-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(floors,false)[0];if(!hit)return;
  const pos=new THREE.Vector3(hit.point.x,1.6,hit.point.z);
  let dir;
  if(mode==='inside'){dir=new THREE.Vector3().subVectors(controls.target,camera.position);}
  else{dir=new THREE.Vector3().subVectors(hit.point,camera.position);dir.y=-0.08;}
  if(Math.hypot(dir.x,dir.z)<1e-3)dir.set(0,-.05,-1);
  press('');goInside(pos,dir);
}
renderer.domElement.addEventListener('dblclick',e=>pickFloor(e.clientX,e.clientY));
let lastTap=0,downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')downAt=[e.clientX,e.clientY,performance.now()];});
renderer.domElement.addEventListener('pointerup',e=>{
  if(e.pointerType!=='touch'||!downAt)return;
  const moved=Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1]),quick=performance.now()-downAt[2]<280;
  if(moved<12&&quick){const now=performance.now();if(now-lastTap<350){pickFloor(e.clientX,e.clientY);lastTap=0;}else lastTap=now;}
});

/* ---------- loop ---------- */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
toggleCut();camera.position.set(2.6+wide(),11,9.2);controls.target.set(wide(),0,.6);setOrbitControls();
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(anim)anim(now);
  walk(dt);
  controls.update();
  renderer.render(scene,camera);
  placeLabels();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
